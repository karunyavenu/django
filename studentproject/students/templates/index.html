<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            color: blue;
        }

        .student {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student List</h1>

    {% if students %}

        {% for student in students %}

            <div class="student">

                <h2>{{ student.name }}</h2>

                <p>Grade: {{ student.grade }}</p>

                {% if student.passed %}
                    <p class="passed">Passed</p>
                {% else %}
                    <p class="failed">Failed</p>
                {% endif %}

            </div>

        {% endfor %}

    {% else %}

        <p>No students found.</p>

    {% endif %}

</body>
</html>
